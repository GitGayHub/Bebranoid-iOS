name: Bebranoid
options:
  bundleIdPrefix: com.bebranoid
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

packages:
  TDLibFramework:
    url: https://github.com/Swiftgram/TDLibFramework
    exactVersion: 1.8.68-18c8f7a0

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    INFOPLIST_FILE: Bebranoid/Info.plist
    CODE_SIGN_ENTITLEMENTS: Bebranoid/Bebranoid.entitlements
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Bebranoid:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Bebranoid
        excludes:
          - "Widgets/**"
          - "Info.plist"
          - "Bebranoid.entitlements"
    dependencies:
      - package: TDLibFramework
        product: TDLibFramework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bebranoid.ios
        PRODUCT_NAME: Bebranoid
        INFOPLIST_FILE: Bebranoid/Info.plist
        CODE_SIGN_ENTITLEMENTS: Bebranoid/Bebranoid.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Bebranoid/Info.plist
      properties:
        CFBundleDisplayName: Bebranoid
        CFBundleName: Bebranoid
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.bebranoid.ios.cache-refresh
          - com.bebranoid.ios.telegram-sync
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: NO
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

  BebranoidTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/BebranoidTests
    dependencies:
      - target: Bebranoid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bebranoid.ios.tests
        GENERATE_INFOPLIST_FILE: YES
