name: iOS Simulator Preview & Screenshots (Free macOS CI)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-preview:
    name: Simulator Boot, Launch, Screenshots & Real H.264 Video
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure XcodeGen & FFmpeg Installed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' Bebranoid.xcodeproj/project.pbxproj
          xcodebuild -list -project Bebranoid.xcodeproj

      - name: Select Best Available iPhone Pro Max Simulator
        id: sim
        run: |
          mkdir -p build/preview/screenshots
          mkdir -p build/preview/mesh
          mkdir -p build/preview/logs

          SIM_LINE=""
          for MODEL in "iPhone 17 Pro Max" "iPhone 16 Pro Max" "iPhone 15 Pro Max"; do
            FOUND=$(xcrun simctl list devices available | grep -F "$MODEL (" | head -n 1 || true)
            if [ -n "$FOUND" ]; then
              SIM_LINE="$FOUND"
              break
            fi
          done
          if [ -z "$SIM_LINE" ]; then
            SIM_LINE=$(xcrun simctl list devices available | grep -E "iPhone.*Pro Max" | head -n 1 || true)
          fi
          if [ -z "$SIM_LINE" ]; then
            SIM_LINE=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 || true)
          fi

          DEVICE_UDID=$(echo "$SIM_LINE" | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}" | head -n 1)
          DEVICE_NAME=$(echo "$SIM_LINE" | sed -E 's/^[[:space:]]*([^(]+)[[:space:]]*\([0-9A-F-]+\).*/\1/' | xargs)
          XCODE_VER=$(xcodebuild -version | tr '\n' ' ')

          echo "udid=$DEVICE_UDID" >> "$GITHUB_OUTPUT"
          echo "name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"

          cat <<EOF > build/preview/simulator-device.json
          {
            "deviceName": "$DEVICE_NAME",
            "deviceUDID": "$DEVICE_UDID",
            "xcodeVersion": "$XCODE_VER",
            "capturedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Build Debug App for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Bebranoid.xcodeproj \
            -scheme Bebranoid \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build/preview/logs/build-simulator.log

      - name: Boot Simulator, Capture Unique Screenshots & Record Real H.264 MP4 Video
        run: |
          set -e
          DEVICE_UDID="${{ steps.sim.outputs.udid }}"
          APP_PATH=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -name "Bebranoid.app" -maxdepth 2 | head -n 1)
          echo "Built Simulator App: $APP_PATH"

          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl ui "$DEVICE_UDID" appearance dark || true
          xcrun simctl status_bar "$DEVICE_UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true

          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"

          capture_screen() {
            local SCREEN_ARG="$1"
            local OUT_FILE="$2"
            shift 2
            echo "Launching Bebranoid for screen=$SCREEN_ARG $* -> $OUT_FILE"
            xcrun simctl terminate "$DEVICE_UDID" com.bebranoid.ios >/dev/null 2>&1 || true
            sleep 0.5
            xcrun simctl launch "$DEVICE_UDID" com.bebranoid.ios --ui-testing-demo "--screen=$SCREEN_ARG" "$@" >> build/preview/logs/launch-logs.txt 2>&1
            sleep 2.6
            xcrun simctl io "$DEVICE_UDID" screenshot "$OUT_FILE"
            local FSIZE=$(stat -f%z "$OUT_FILE" 2>/dev/null || echo 0)
            if [ "$FSIZE" -lt 150000 ]; then
              echo "Screenshot $OUT_FILE was small ($FSIZE bytes), waiting for frame render and retrying..."
              sleep 2.5
              xcrun simctl io "$DEVICE_UDID" screenshot "$OUT_FILE"
              FSIZE=$(stat -f%z "$OUT_FILE" 2>/dev/null || echo 0)
              if [ "$FSIZE" -lt 150000 ]; then
                xcrun simctl terminate "$DEVICE_UDID" com.bebranoid.ios >/dev/null 2>&1 || true
                sleep 0.8
                xcrun simctl launch "$DEVICE_UDID" com.bebranoid.ios --ui-testing-demo "--screen=$SCREEN_ARG" "$@" >> build/preview/logs/launch-logs.txt 2>&1
                sleep 3.2
                xcrun simctl io "$DEVICE_UDID" screenshot "$OUT_FILE"
              fi
            fi
          }

          capture_screen "library"     "build/preview/screenshots/01-library.png"
          capture_screen "tracks"      "build/preview/screenshots/02-tracks.png"
          capture_screen "albums"      "build/preview/screenshots/03-albums.png"
          capture_screen "artists"     "build/preview/screenshots/04-artists.png"
          capture_screen "playlists"   "build/preview/screenshots/05-playlists.png"
          capture_screen "player"      "build/preview/screenshots/06-player.png"
          capture_screen "lyrics"      "build/preview/screenshots/07-lyrics.png"
          capture_screen "queue"       "build/preview/screenshots/08-queue.png"
          capture_screen "settings"    "build/preview/screenshots/09-settings.png"
          capture_screen "mini-player" "build/preview/screenshots/10-mini-player.png"
          capture_screen "diagnostics" "build/preview/screenshots/11-diagnostics.png"

          # Capture 4 fixed animation time frames of HarmonoidMeshBackground (t = 0.0, 3.5, 7.0, 10.0s)
          capture_screen "player" "build/preview/mesh/mesh-time-0.0s.png"  "--mesh-fixture=vivid" "--mesh-time=0.0"
          capture_screen "player" "build/preview/mesh/mesh-time-3.5s.png"  "--mesh-fixture=vivid" "--mesh-time=3.5"
          capture_screen "player" "build/preview/mesh/mesh-time-7.0s.png"  "--mesh-fixture=vivid" "--mesh-time=7.0"
          capture_screen "player" "build/preview/mesh/mesh-time-10.0s.png" "--mesh-fixture=vivid" "--mesh-time=10.0"

          # Capture 4 reference HarmonoidMeshBackground cover fixtures
          capture_screen "player" "build/preview/mesh/mesh-01-vivid.png"    "--mesh-fixture=vivid"
          capture_screen "player" "build/preview/mesh/mesh-02-pastel.png"   "--mesh-fixture=pastel"
          capture_screen "player" "build/preview/mesh/mesh-03-dark-red.png" "--mesh-fixture=dark-red"
          capture_screen "player" "build/preview/mesh/mesh-04-bw.png"       "--mesh-fixture=bw"

          # Encode real H.264 MP4 video from live captured Simulator screen sequence & Mesh animation frames (never copy a PNG!)
          echo "Encoding real H.264 MP4 video from captured Simulator screen sequence & Mesh animation frames..."
          mkdir -p build/preview/video-seq
          cp build/preview/screenshots/01-library.png     build/preview/video-seq/frame_01.png
          cp build/preview/screenshots/02-tracks.png      build/preview/video-seq/frame_02.png
          cp build/preview/screenshots/03-albums.png      build/preview/video-seq/frame_03.png
          cp build/preview/screenshots/04-artists.png     build/preview/video-seq/frame_04.png
          cp build/preview/screenshots/05-playlists.png   build/preview/video-seq/frame_05.png
          cp build/preview/screenshots/06-player.png      build/preview/video-seq/frame_06.png
          cp build/preview/mesh/mesh-time-0.0s.png        build/preview/video-seq/frame_07.png
          cp build/preview/mesh/mesh-time-3.5s.png        build/preview/video-seq/frame_08.png
          cp build/preview/mesh/mesh-time-7.0s.png        build/preview/video-seq/frame_09.png
          cp build/preview/mesh/mesh-time-10.0s.png       build/preview/video-seq/frame_10.png
          cp build/preview/screenshots/07-lyrics.png      build/preview/video-seq/frame_11.png
          cp build/preview/screenshots/08-queue.png       build/preview/video-seq/frame_12.png
          cp build/preview/screenshots/10-mini-player.png build/preview/video-seq/frame_13.png
          cp build/preview/screenshots/11-diagnostics.png build/preview/video-seq/frame_14.png

          ffmpeg -y -framerate 1 -i "build/preview/video-seq/frame_%02d.png" \
            -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2,fps=30" \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart \
            "build/preview/preview-animation.mp4"
          rm -rf build/preview/video-seq

          # Package Simulator .app bundle
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/Bebranoid-iOS-Simulator-App.zip

      - name: Verify Unique Screenshot Hashes & Valid H.264 MP4 Stream
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");
            const { execSync } = require("child_process");

            const shotsDir = "build/preview/screenshots";
            const meshDir = "build/preview/mesh";
            const shots = fs.readdirSync(shotsDir).filter(f => f.endsWith(".png")).sort();
            const meshShots = fs.readdirSync(meshDir).filter(f => f.endsWith(".png")).sort();

            if (shots.length < 10) {
              throw new Error("Expected at least 10 screenshots, found " + shots.length);
            }

            const seenHashes = new Map();
            const shotMeta = [];
            for (const f of shots) {
              const p = path.join(shotsDir, f);
              const buf = fs.readFileSync(p);
              if (buf.length < 50000) {
                throw new Error(`Screenshot ${f} is too small (${buf.length} bytes)`);
              }
              const sha256 = crypto.createHash("sha256").update(buf).digest("hex");
              if (seenHashes.has(sha256)) {
                throw new Error(`Duplicate screenshot hash detected: ${f} is identical to ${seenHashes.get(sha256)} (${sha256})`);
              }
              seenHashes.set(sha256, f);
              shotMeta.push({ file: f, sizeBytes: buf.length, sha256 });
            }

            const meshMeta = meshShots.map(f => {
              const p = path.join(meshDir, f);
              const buf = fs.readFileSync(p);
              return { file: f, sizeBytes: buf.length, sha256: crypto.createHash("sha256").update(buf).digest("hex") };
            });

            // Verify preview-animation.mp4 via ffprobe
            const mp4Path = "build/preview/preview-animation.mp4";
            if (!fs.existsSync(mp4Path)) {
              throw new Error("preview-animation.mp4 does not exist");
            }
            const mp4Buf = fs.readFileSync(mp4Path);
            // Ensure it does NOT start with PNG magic bytes (89 50 4E 47)
            if (mp4Buf[0] === 0x89 && mp4Buf[1] === 0x50 && mp4Buf[2] === 0x4E && mp4Buf[3] === 0x47) {
              throw new Error("preview-animation.mp4 is a PNG file disguised as MP4!");
            }
            const probeJson = JSON.parse(execSync(`ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,nb_frames -show_entries format=format_name,duration -of json "${mp4Path}"`).toString());
            const stream = (probeJson.streams || [])[0] || {};
            if (stream.codec_name !== "h264") {
              throw new Error(`Expected H.264 video stream in preview-animation.mp4, got ${stream.codec_name}`);
            }

            const dev = JSON.parse(fs.readFileSync("build/preview/simulator-device.json", "utf8"));
            const manifest = {
              commitSha: process.env.GITHUB_SHA,
              branch: process.env.GITHUB_REF_NAME,
              simulator: dev,
              screenshots: shotMeta,
              meshFrames: meshMeta,
              hasAnimationVideo: true,
              videoStream: {
                codec: stream.codec_name,
                width: stream.width,
                height: stream.height,
                frames: stream.nb_frames,
                duration: (probeJson.format || {}).duration,
                sizeBytes: mp4Buf.length
              }
            };
            fs.writeFileSync("build/preview/preview-manifest.json", JSON.stringify(manifest, null, 2));
            console.log("Verified " + shotMeta.length + " unique screenshots and valid H.264 MP4 preview video.");
          '

      - name: Upload Bebranoid-iOS-Preview Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bebranoid-iOS-Preview
          path: |
            build/preview/**
          retention-days: 14

      - name: Upload Bebranoid-iOS-Simulator-App.zip Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bebranoid-iOS-Simulator-App
          path: build/Bebranoid-iOS-Simulator-App.zip
          retention-days: 14
